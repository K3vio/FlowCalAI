<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowCal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100">

  <!-- ===== Header ===== -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">📅 FlowCal</h1>

    <div class="space-x-2">
      <button id="previousWeekBtn" class="px-4 py-2 bg-gray-200 rounded">Previous</button>
      <button id="todayBtn" class="px-4 py-2 bg-gray-200 rounded">Today</button>
      <button id="nextWeekBtn" class="px-4 py-2 bg-gray-200 rounded">Next</button>

      <button id="addScheduleBtn"
        class="px-4 py-2 bg-blue-600 text-white rounded">
        + Add Schedule
      </button>
    </div>
  </header>

  <!-- ===== Calendar ===== -->
  <main class="p-6">

    <!-- Day names -->
    <div id="calendarHeader"
      class="grid grid-cols-8 bg-white border font-semibold">
    </div>

    <!-- Time column + calendar -->
    <div class="grid grid-cols-8">

      <!-- Time labels -->
      <div id="timeLabels" class="border-r bg-white">
      </div>

      <!-- Calendar columns -->
      <div id="dayColumns" class="col-span-7 grid grid-cols-7">
      </div>

    </div>

  </main>

  <!-- ===== Add Schedule  ===== -->
  <div id="add"
       class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

    <div class="bg-white p-6 rounded-lg w-96">

      <h2 class="text-xl font-bold mb-4">Add Schedule</h2>

      <form id="scheduleForm" class="space-y-3">

        <input id="titleInput"
               type="text"
               placeholder="Schedule title"
               class="w-full border p-2 rounded">

        <input id="dateInput"
               type="date"
               class="w-full border p-2 rounded">

        <div class="grid grid-cols-2 gap-2">
          <input id="startInput"
                 type="time"
                 class="border p-2 rounded">

          <input id="endInput"
                 type="time"
                 class="border p-2 rounded">
        </div>

        <select id="typeInput"
                class="w-full border p-2 rounded">
          <option value="fixed">🔒 Fixed</option>
          <option value="flexible">↻ Flexible</option>
        </select>

        <div class="flex justify-end gap-2">
          <button type="button"
                  id="cancelBtn"
                  class="px-4 py-2 border rounded">
            Cancel
          </button>

          <button type="submit"
                  class="px-4 py-2 bg-blue-600 text-white rounded">
            Add Schedule
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- ===== Conflict ===== -->
  <div id="conflict"
       class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

    <div class="bg-white p-6 rounded-lg w-96">

      <h2 id="conflictTitle"
          class="text-xl font-bold mb-2">
      </h2>

      <p id="conflictMessage"
         class="mb-4">
      </p>

      <div id="conflictButtons"
           class="flex justify-end gap-2">
      </div>

    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
